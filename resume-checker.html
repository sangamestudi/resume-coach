<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Checker - AI Resume Coach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            display: none;
        }
        
        .score {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }
        
        .score.good { color: #4caf50; }
        .score.average { color: #ff9800; }
        .score.bad { color: #f44336; }
        
        .keyword-list {
            list-style: none;
            padding: 0;
        }
        
        .keyword-list li {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .api-key-input {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100%;
        }
        
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Home</a>
        
        <h1>📄 ATS Resume Checker</h1>
        <p class="subtitle">Paste your resume and job description to get ATS score</p>
        
        <div class="form-group">
            <label>🔑 DeepSeek API Key (Get it free from platform.deepseek.com)</label>
            <input type="password" id="apiKey" class="api-key-input" placeholder="Enter your DeepSeek API key">
            <small style="color: #666;">Don't have one? <a href="https://platform.deepseek.com" target="_blank">Get free API key</a> (₹14 credit)</small>
        </div>
        
        <div class="form-group">
            <label>📝 Your Resume Text</label>
            <textarea id="resume" rows="8" placeholder="Paste your resume here..."></textarea>
        </div>
        
        <div class="form-group">
            <label>💼 Job Description</label>
            <textarea id="jobDescription" rows="6" placeholder="Paste the job description here..."></textarea>
        </div>
        
        <button onclick="checkATS()">🔍 Check ATS Score</button>
        
        <div class="loading" id="loading">
            🤖 AI is analyzing your resume...
        </div>
        
        <div class="result" id="result">
            <h3>📊 Analysis Result</h3>
            <div class="score" id="score"></div>
            <h4>🔑 Missing Keywords:</h4>
            <ul class="keyword-list" id="missingKeywords"></ul>
            <h4>💡 Improvement Tips:</h4>
            <ul class="keyword-list" id="tips"></ul>
        </div>
    </div>
    
    <script>
        async function checkATS() {
            const apiKey = document.getElementById('apiKey').value;
            const resume = document.getElementById('resume').value;
            const jobDesc = document.getElementById('jobDescription').value;
            
            if (!apiKey) {
                alert('Please enter your DeepSeek API key');
                return;
            }
            
            if (!resume || !jobDesc) {
                alert('Please fill both resume and job description');
                return;
            }
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are an ATS (Applicant Tracking System) expert. Analyze the resume against the job description. Return ONLY valid JSON with this structure: {"score": number (0-100), "missingKeywords": ["keyword1", "keyword2"], "tips": ["tip1", "tip2"]}'
                            },
                            {
                                role: 'user',
                                content: `Resume:\n${resume}\n\nJob Description:\n${jobDesc}`
                            }
                        ],
                        temperature: 0.7
                    })
                });
                
                const data = await response.json();
                const content = data.choices[0].message.content;
                
                // Parse JSON response
                let analysis;
                try {
                    analysis = JSON.parse(content);
                } catch(e) {
                    // If not pure JSON, extract using regex
                    const jsonMatch = content.match(/\{.*\}/s);
                    analysis = JSON.parse(jsonMatch[0]);
                }
                
                // Display results
                displayResults(analysis);
                
            } catch(error) {
                alert('Error: ' + error.message);
                console.error(error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function displayResults(analysis) {
            const scoreDiv = document.getElementById('score');
            const score = analysis.score || 0;
            scoreDiv.textContent = `${score}/100`;
            
            if (score >= 70) {
                scoreDiv.className = 'score good';
            } else if (score >= 50) {
                scoreDiv.className = 'score average';
            } else {
                scoreDiv.className = 'score bad';
            }
            
            // Missing keywords
            const keywordsList = document.getElementById('missingKeywords');
            keywordsList.innerHTML = '';
            (analysis.missingKeywords || []).forEach(keyword => {
                const li = document.createElement('li');
                li.textContent = keyword;
                keywordsList.appendChild(li);
            });
            
            // Tips
            const tipsList = document.getElementById('tips');
            tipsList.innerHTML = '';
            (analysis.tips || []).forEach(tip => {
                const li = document.createElement('li');
                li.textContent = tip;
                tipsList.appendChild(li);
            });
            
            document.getElementById('result').style.display = 'block';
            
            // Scroll to result
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>

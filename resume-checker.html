<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Checker - AI Resume Coach</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a8c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        
        .main-card {
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        textarea, input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 14px;
            font-family: inherit;
            transition: 0.3s;
        }
        
        textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }
        
        .result {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            display: none;
        }
        
        .score-circle {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            position: relative;
        }
        
        .score-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 800;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .keyword-chip {
            display: inline-block;
            background: white;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 20px;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        @media (max-width: 768px) {
            .main-card { padding: 20px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <a href="index.html" class="logo">🤖 AI Resume Coach</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="resume-checker.html">Resume</a>
                <a href="interview.html">Interview</a>
                <a href="live-interview.html">Live</a>
            </div>
        </nav>
        
        <div class="main-card">
            <h1>📄 ATS Resume Checker</h1>
            <p class="subtitle">Get your resume scored and optimized for ATS systems</p>
            
            <div class="form-group">
                <label>🔑 DeepSeek API Key</label>
                <input type="password" id="apiKey" placeholder="Enter your DeepSeek API key">
                <small>Get free key from <a href="https://platform.deepseek.com" target="_blank">platform.deepseek.com</a></small>
            </div>
            
            <div class="form-group">
                <label>📝 Your Resume</label>
                <textarea id="resume" rows="8" placeholder="Paste your resume here..."></textarea>
            </div>
            
            <div class="form-group">
                <label>💼 Job Description</label>
                <textarea id="jobDescription" rows="6" placeholder="Paste the job description..."></textarea>
            </div>
            
            <button class="btn" onclick="checkATS()">
                <i class="fas fa-chart-line"></i> Analyze My Resume
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>🤖 AI is analyzing your resume...</p>
            </div>
            
            <div class="result" id="result">
                <h3>📊 Analysis Results</h3>
                <div class="score-circle" id="scoreCircle">
                    <canvas id="scoreCanvas" width="150" height="150"></canvas>
                    <div class="score-text" id="scoreText">0%</div>
                </div>
                <h4>🔑 Missing Keywords</h4>
                <div id="missingKeywords"></div>
                <h4>💡 Improvement Tips</h4>
                <div id="tips"></div>
                <button class="btn" onclick="copyResults()" style="margin-top: 20px; background: #4caf50;">
                    <i class="fas fa-copy"></i> Copy Results
                </button>
            </div>
        </div>
    </div>
    
    <script>
        async function checkATS() {
            const apiKey = document.getElementById('apiKey').value;
            const resume = document.getElementById('resume').value;
            const jobDesc = document.getElementById('jobDescription').value;
            
            if (!apiKey) { alert('Please enter your DeepSeek API key'); return; }
            if (!resume || !jobDesc) { alert('Please fill both resume and job description'); return; }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{
                            role: 'system',
                            content: 'Return JSON: {"score": number, "missingKeywords": [], "tips": []}'
                        }, {
                            role: 'user',
                            content: `Resume: ${resume}\nJob: ${jobDesc}`
                        }]
                    })
                });
                
                const data = await response.json();
                const content = data.choices[0].message.content;
                const jsonMatch = content.match(/\{.*\}/s);
                const analysis = JSON.parse(jsonMatch[0]);
                
                displayResults(analysis);
                
            } catch(error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function displayResults(analysis) {
            const score = analysis.score || 0;
            document.getElementById('scoreText').textContent = `${score}%`;
            
            // Draw score circle
            const canvas = document.getElementById('scoreCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 150, 150);
            const gradient = ctx.createLinearGradient(0, 0, 150, 150);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            
            // Background circle
            ctx.beginPath();
            ctx.arc(75, 75, 65, 0, 2 * Math.PI);
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 10;
            ctx.stroke();
            
            // Score circle
            ctx.beginPath();
            ctx.arc(75, 75, 65, -Math.PI/2, -Math.PI/2 + (score/100) * 2 * Math.PI);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 10;
            ctx.stroke();
            
            // Keywords
            const keywordsDiv = document.getElementById('missingKeywords');
            keywordsDiv.innerHTML = '';
            (analysis.missingKeywords || []).forEach(k => {
                keywordsDiv.innerHTML += `<span class="keyword-chip">${k}</span>`;
            });
            
            // Tips
            const tipsDiv = document.getElementById('tips');
            tipsDiv.innerHTML = '<ul>';
            (analysis.tips || []).forEach(t => {
                tipsDiv.innerHTML += `<li style="margin: 10px 0">${t}</li>`;
            });
            tipsDiv.innerHTML += '</ul>';
            
            document.getElementById('result').style.display = 'block';
        }
        
        function copyResults() {
            const text = document.getElementById('result').innerText;
            navigator.clipboard.writeText(text);
            alert('Results copied to clipboard!');
        }
    </script>
</body>
</html>

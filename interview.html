<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Interview - AI Resume Coach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .industry-selector {
            margin-bottom: 30px;
        }
        
        .industry-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .industry-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .industry-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        .question-card {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
        }
        
        .question-text {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            margin: 10px 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
            display: none;
        }
        
        .api-key-input {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100%;
        }
        
        .question-bank {
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .question-item {
            background: #f9f9f9;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .question-item:hover {
            background: #e8e8e8;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Home</a>
        
        <h1>🎤 Mock Interview Coach</h1>
        <p class="subtitle">Practice with real interview questions & get AI feedback</p>
        
        <div class="form-group">
            <label>🔑 DeepSeek API Key</label>
            <input type="password" id="apiKey" class="api-key-input" placeholder="Enter your DeepSeek API key">
        </div>
        
        <div class="industry-selector">
            <label><strong>Select Industry:</strong></label>
            <div class="industry-buttons">
                <button class="industry-btn" onclick="selectIndustry('IT')">💻 IT/Software</button>
                <button class="industry-btn" onclick="selectIndustry('Banking')">🏦 Banking</button>
                <button class="industry-btn" onclick="selectIndustry('Marketing')">📢 Marketing</button>
                <button class="industry-btn" onclick="selectIndustry('Fresher')">🎓 Fresher</button>
            </div>
        </div>
        
        <div id="interviewArea">
            <button onclick="getRandomQuestion()">🎲 Get Random Question</button>
            
            <div class="question-card" id="questionCard" style="display: none;">
                <div class="question-text" id="questionText"></div>
                <textarea id="answer" rows="5" placeholder="Type your answer here..."></textarea>
                <button onclick="submitAnswer()">Submit Answer → Get Feedback</button>
                <button onclick="nextQuestion()">Next Question →</button>
                
                <div class="feedback" id="feedback">
                    <h3>🤖 AI Feedback:</h3>
                    <p id="feedbackText"></p>
                </div>
            </div>
        </div>
        
        <div class="question-bank" id="questionBank">
            <h3>📚 Question Bank (Click to practice)</h3>
            <div id="questionsList"></div>
        </div>
    </div>
    
    <script>
        // Question Bank
        const questions = {
            IT: [
                "Tell me about yourself.",
                "What is your favorite programming language and why?",
                "Explain the difference between REST API and GraphQL.",
                "How do you handle merge conflicts in Git?",
                "Describe a challenging bug you fixed.",
                "What is your approach to learning new technologies?",
                "Explain OOP concepts with examples.",
                "How do you ensure code quality?",
                "Tell me about a project you're proud of.",
                "Why do you want to work in IT?"
            ],
            Banking: [
                "Why do you want to work in banking?",
                "What is the current repo rate?",
                "Explain the difference between NEFT and RTGS.",
                "How do you handle customer complaints?",
                "What are KYC norms?",
                "Tell me about a time you handled pressure.",
                "What is your understanding of risk management?",
                "Why should we hire you?",
                "Explain compound interest vs simple interest.",
                "How do you stay updated with banking policies?"
            ],
            Marketing: [
                "What is your favorite marketing campaign and why?",
                "Explain SEO and its importance.",
                "How do you measure marketing ROI?",
                "Tell me about a successful social media strategy.",
                "What's the difference between B2B and B2C marketing?",
                "How do you handle negative brand feedback?",
                "Describe a time you increased engagement.",
                "What are your favorite marketing tools?",
                "Explain A/B testing.",
                "How do you create a marketing budget?"
            ],
            Fresher: [
                "Tell me about yourself.",
                "What are your strengths and weaknesses?",
                "Why should we hire you as a fresher?",
                "Where do you see yourself in 5 years?",
                "Tell me about your college projects.",
                "Why did you choose this field?",
                "How do you handle criticism?",
                "Describe a leadership experience.",
                "What are you passionate about?",
                "Why do you want to join our company?"
            ]
        };
        
        let currentIndustry = 'IT';
        let currentQuestion = '';
        
        function selectIndustry(industry) {
            currentIndustry = industry;
            // Update active button
            document.querySelectorAll('.industry-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Load questions for this industry
            loadQuestionsList();
        }
        
        function loadQuestionsList() {
            const questionsList = document.getElementById('questionsList');
            questionsList.innerHTML = '';
            
            questions[currentIndustry].forEach((q, index) => {
                const div = document.createElement('div');
                div.className = 'question-item';
                div.innerHTML = `<strong>Q${index+1}.</strong> ${q}`;
                div.onclick = () => loadQuestion(q);
                questionsList.appendChild(div);
            });
        }
        
        function getRandomQuestion() {
            const industryQuestions = questions[currentIndustry];
            const randomIndex = Math.floor(Math.random() * industryQuestions.length);
            currentQuestion = industryQuestions[randomIndex];
            loadQuestion(currentQuestion);
        }
        
        function loadQuestion(question) {
            currentQuestion = question;
            document.getElementById('questionText').textContent = question;
            document.getElementById('questionCard').style.display = 'block';
            document.getElementById('answer').value = '';
            document.getElementById('feedback').style.display = 'none';
            
            // Scroll to question
            document.getElementById('questionCard').scrollIntoView({ behavior: 'smooth' });
        }
        
        async function submitAnswer() {
            const apiKey = document.getElementById('apiKey').value;
            const answer = document.getElementById('answer').value;
            
            if (!apiKey) {
                alert('Please enter your DeepSeek API key');
                return;
            }
            
            if (!answer) {
                alert('Please type your answer first');
                return;
            }
            
            document.getElementById('feedback').style.display = 'block';
            document.getElementById('feedbackText').innerHTML = '<em>Analyzing your answer...</em>';
            
            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            {
                                role: 'system',
                                content: `You are an experienced interviewer for ${currentIndustry} industry. Give constructive feedback on the candidate's answer. Include: 1) What was good, 2) What can improve, 3) Sample answer. Be encouraging but honest. Keep response under 200 words.`
                            },
                            {
                                role: 'user',
                                content: `Question: ${currentQuestion}\n\nCandidate's Answer: ${answer}`
                            }
                        ]
                    })
                });
                
                const data = await response.json();
                const feedback = data.choices[0].message.content;
                document.getElementById('feedbackText').innerHTML = feedback.replace(/\n/g, '<br>');
                
            } catch(error) {
                document.getElementById('feedbackText').innerHTML = 'Error getting feedback. Please check your API key.';
            }
        }
        
        function nextQuestion() {
            getRandomQuestion();
        }
        
        // Load initial questions
        loadQuestionsList();
    </script>
</body>
</html>
